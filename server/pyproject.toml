[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zephyrex-auth"
version = "0.1.0"
description = "Identity-provider server on the Zephyrex framework — OAuth2/OIDC, SAML, LDAP, RADIUS, SCIM, WebAuthn, Kerberos, x509, proxy/forward auth (provider + consumer)"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
# The protocol extensions ship in the framework (its public 0.0.x releases
# on PyPI); this project only boots them.
dependencies = [
    "zephyrex[forward-auth-consumer,forward-auth-provider,kerberos-provider,ldap-consumer,ldap-provider,oauth-consumer,oauth-provider,proxy-auth-consumer,proxy-auth-provider,radius-consumer,radius-provider,saml-consumer,saml-provider,scim-consumer,scim-provider,webauthn-consumer,webauthn-provider,x509-consumer,x509-provider]~=0.0.1",
]

[project.optional-dependencies]
# Kerberos/GSSAPI needs system libs (libkrb5-dev / MIT or Heimdal), so it is
# opt-in rather than a hard dependency of the base install.
kerberos = ["zephyrex[kerberos-consumer]~=0.0.1"]

[tool.setuptools]
py-modules = ["app"]
