[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zephyrex-auth"
version = "0.1.0"
description = "Identity-provider extensions for Zephyrex Framework Server — OAuth2/OIDC, SAML, LDAP, RADIUS, SCIM, WebAuthn, Kerberos, x509, proxy/forward auth (provider + consumer)"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "zephyrex @ git+https://github.com/JamesonRGrieve/ServerFramework.git",
    "requests>=2.31.0",
    "ldap3>=2.9.1",
    "pysaml2>=7.0.0",
    "pyrad>=2.4",
    "fido2>=1.1.0",
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
# Kerberos/GSSAPI needs system libs (libkrb5-dev / MIT or Heimdal), so it is
# opt-in rather than a hard dependency of the base install.
kerberos = [
    "gssapi>=1.8.0",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["extensions*"]
exclude = ["*__pycache__*", "*_test.py"]
namespaces = true
